<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente - {{ store_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-8 w-full max-w-md shadow-2xl">
        <div class="text-center mb-8">
            {% if store_logo %}
            <img src="{{ store_logo }}" alt="Logo" class="w-20 h-20 object-contain mx-auto mb-4 rounded-2xl bg-white/5 p-2">
            {% else %}
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center text-white font-black text-3xl mx-auto mb-4 shadow-lg shadow-orange-500/30">
                {{ store_name|slice:":1" }}
            </div>
            {% endif %}
            <h1 class="text-2xl font-black text-white mb-2">{{ store_name }}</h1>
            <p class="text-gray-400 text-sm">Inicia sesión para ver tus pedidos</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-300 mb-2">Usuario o Email</label>
                <input type="text" id="username" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors" placeholder="Tu usuario o email">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-300 mb-2">Contraseña</label>
                <input type="password" id="password" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors" placeholder="Tu contraseña">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-400 hover:to-orange-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-orange-500/30">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-gray-400 text-sm">¿No tienes cuenta? <a href="/catalogo/registro/" class="text-orange-400 font-bold hover:text-orange-300 transition-colors">Regístrate aquí</a></p>
        </div>

        <div id="error" class="mt-4 p-3 bg-red-900/50 border border-red-700 rounded-xl text-red-300 text-sm hidden"></div>
    </div>

    <script>
        const API_URL = '/api/catalog-orders/';
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            try {
                const response = await fetch(API_URL + 'auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('customerToken', data.token);
                    localStorage.setItem('customerUser', JSON.stringify(data.user));
                    window.location.href = '/catalogo/cliente/';
                } else {
                    errorDiv.textContent = data.error || data.non_field_errors?.[0] || 'Error al iniciar sesión';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
